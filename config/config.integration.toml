[server]
host = "127.0.0.1"
port = 4000
max_connections = 20
max_allowed_packet = 16777216
read_timeout = "30s"
write_timeout = "30s"
idle_timeout = "2m"
shutdown_timeout = "10s"

[auth]
username = "archery"
password_env = "GOINCEPTION_PLUS_PASSWORD"

[backup]
host = "127.0.0.1"
port = 3306
user = "root"
password_env = "GOINCEPTION_PLUS_BACKUP_PASSWORD"

[inc]
check_primary_key = true
check_table_comment = false
check_column_comment = false
check_dml_where = true
max_column_count = 100

[inc_level]
er_table_must_have_pk = 1
er_table_must_have_comment = 1
er_column_must_have_comment = 1
er_max_column_count = 1
er_no_where_condition = 2
